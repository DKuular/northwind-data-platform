name: Security Scan

on:
  push:
    branches: [develop, feature/*, main]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-22.04  # Фиксируем версию Ubuntu, не latest!
    
    steps:
      - uses: actions/checkout@v4.1.7  # Фиксированная версия
      
      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets==1.4.0  # Фиксированная версия
      
      - name: Detect secrets in code
        run: |
          detect-secrets scan --baseline .secrets.baseline
      
      - name: Check for hardcoded passwords
        run: |
          if grep -r "password.*=.*['\"][^'\"]*['\"]" --include="*.py" --include="*.sql" --include="*.sh" --exclude-dir=.github --exclude=".env.example" .; then
            echo "❌ Found hardcoded passwords!"
            exit 1
          fi
          echo "✅ No hardcoded passwords found"
      
      - name: Verify no .env in repo
        run: |
          if [ -f .env ]; then
            echo "❌ .env file should not be in repository!"
            exit 1
          fi
          echo "✅ .env file not present"

  validate-secrets:
    runs-on: ubuntu-22.04
    needs: secret-scan
    
    steps:
      - name: Check required secrets exist
        run: |
          REQUIRED_SECRETS="POSTGRES_PASSWORD MINIO_ROOT_PASSWORD"
          MISSING=""
          for secret in $REQUIRED_SECRETS; do
            if [ -z "${{ secrets[secret] }}" ]; then
              MISSING="$MISSING $secret"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "❌ Missing secrets:$MISSING"
            exit 1
          fi
          echo "✅ All required secrets are configured"