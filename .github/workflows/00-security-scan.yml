name: Security Scan

on:
  push:
    branches: [develop, feature/*, main]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets==1.4.0

      - name: Detect secrets in code
        run: |
          detect-secrets scan --baseline .secrets.baseline

      - name: Check for hardcoded passwords
        run: |
          if grep -r "password.*=.*['\"][^'\"]*['\"]" --include="*.py" --include="*.sql" --include="*.sh" --exclude-dir=.github --exclude=".env.example" .; then
            echo "❌ Found hardcoded passwords!"
            exit 1
          fi
          echo "✅ No hardcoded passwords found"

      - name: Verify no .env in repo
        run: |
          if [ -f .env ]; then
            echo "❌ .env file should not be in repository!"
            exit 1
          fi
          echo "✅ .env file not present"

  validate-secrets:
    runs-on: ubuntu-22.04
    needs: secret-scan

    steps:
      - name: Check POSTGRES_PASSWORD secret
        run: |
          if [ -z "${{ secrets.POSTGRES_PASSWORD }}" ]; then
            echo "❌ Secret POSTGRES_PASSWORD is not set"
            exit 1
          fi
          echo "✅ POSTGRES_PASSWORD is set"

      - name: Check MINIO_ROOT_PASSWORD secret
        run: |
          if [ -z "${{ secrets.MINIO_ROOT_PASSWORD }}" ]; then
            echo "❌ Secret MINIO_ROOT_PASSWORD is not set"
            exit 1
          fi
          echo "✅ MINIO_ROOT_PASSWORD is set"

      - name: Check DEBEZIUM_PASSWORD secret
        run: |
          if [ -z "${{ secrets.DEBEZIUM_PASSWORD }}" ]; then
            echo "⚠️ Secret DEBEZIUM_PASSWORD is not set (optional for now)"
          else
            echo "✅ DEBEZIUM_PASSWORD is set"
          fi

      - name: Check AIRFLOW_PASSWORD secret
        run: |
          if [ -z "${{ secrets.AIRFLOW_PASSWORD }}" ]; then
            echo "⚠️ Secret AIRFLOW_PASSWORD is not set (optional for now)"
          else
            echo "✅ AIRFLOW_PASSWORD is set"
          fi

      - name: Summary
        run: echo "✅ All required secrets validation completed"
