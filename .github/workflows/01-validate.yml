name: Validate Code & Configs

on:
  push:
    branches: [develop, feature/*]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main, develop]

jobs:
  validate-sql:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Validate SQL syntax
        run: |
          for sql in $(find . -name "*.sql" -not -path "./.git/*"); do
            echo "Validating $sql"
            if ! grep -q "CREATE\|INSERT\|SELECT\|UPDATE\|DELETE" "$sql"; then
              echo "⚠️  $sql appears empty or invalid"
            fi
          done

      - name: Check for dangerous SQL
        run: |
          if grep -r "DROP.*DATABASE" --include="*.sql" .; then
            echo "⚠️  Warning: Found DROP DATABASE in SQL files"
          fi

  validate-docker:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Create .env for validation
        run: |
          cat > .env << 'EOF'
          POSTGRES_PASSWORD=test123
          MINIO_ROOT_PASSWORD=test123
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=admin
          OPENMETADATA_DB_USER=openmetadata_user
          OPENMETADATA_DB_PASSWORD=test123
          EOF

      - name: Validate Docker Compose files
        run: |
          for compose in $(find servers -name "docker-compose.yml" 2>/dev/null); do
            echo "Validating $compose"
            docker compose -f "$compose" --env-file .env config --quiet || exit 1
          done

  validate-yaml:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Create yamllint config
        run: |
          cat > .yamllint << 'EOF'
          extends: default
          rules:
            line-length: disable
            document-start: disable
            truthy: disable
            trailing-spaces: disable
            new-line-at-end-of-file: disable
            braces:
              level: warning
            brackets:
              level: warning
            commas:
              level: warning
          EOF

      - name: Run yamllint
        run: |
          yamllint -c .yamllint .github/workflows/*.yml || true
          yamllint -c .yamllint .pre-commit-config.yaml || true

  validate-shell:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck=0.8.0-2

      - name: Run shellcheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" -exec shellcheck {} \;