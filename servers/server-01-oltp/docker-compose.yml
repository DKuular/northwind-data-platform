name: northwind-oltp

services:
  postgres:
    image: postgres:15.8-alpine3.20
    container_name: northwind-postgres
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    command: |
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c listen_addresses='*'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - oltp-network
      - data-platform-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.8.1-python3.11
    container_name: northwind-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres/northwind
      PYTHONPATH: /opt/airflow/dags_modules
      AIRFLOW__WEBSERVER__WORKERS: 2
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: 1800
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 120
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dags_modules:/opt/airflow/dags_modules
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
    ports:
      - "8080:8080"
    networks:
      - oltp-network
      - data-platform-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      # Ждём PostgreSQL
      until pg_isready -h postgres -U ${POSTGRES_USER:-postgres}; do
        echo 'Waiting for PostgreSQL...'
        sleep 2
      done

      # Инициализируем базу данных Airflow
      airflow db init

      # Создаём пользователя (если не существует)
      airflow users list | grep -q admin || airflow users create \
        --username admin \
        --password ${AIRFLOW_PASSWORD:-admin} \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email admin@example.com

      # Запускаем веб-сервер
      exec airflow webserver
      "

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: northwind-airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres/northwind
      PYTHONPATH: /opt/airflow/dags_modules
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dags_modules:/opt/airflow/dags_modules
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
    networks:
      - oltp-network
      - data-platform-network
    depends_on:
      postgres:
        condition: service_healthy
    command: scheduler
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  oltp-network:
    external: true
  data-platform-network:
    external: true