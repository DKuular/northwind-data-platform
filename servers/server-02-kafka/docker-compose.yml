name: northwind-kafka

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.2
    container_name: northwind-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - northwind-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.2
    container_name: northwind-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://northwind-kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - northwind-net
    restart: unless-stopped

networks:
  northwind-net:
    external: true
    name: northwind-net