name: northwind-kafka-connect

services:
  kafka-connect:
    image: debezium/connect:2.6.1.Final
    container_name: northwind-connect
    environment:
      BOOTSTRAP_SERVERS: northwind-kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      REST_ADVERTISED_HOST_NAME: localhost
      REST_ADVERTISED_PORT: 8083
      # Java agent для JMX экспортера
      KAFKA_OPTS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=12345:/opt/jmx/jmx-exporter-config.yaml"
    ports:
      - "8083:8083"
      - "12345:12345"
    volumes:
      - ./jmx/jmx_prometheus_javaagent.jar:/opt/jmx/jmx_prometheus_javaagent.jar
      - ./jmx/jmx-exporter-config.yaml:/opt/jmx/jmx-exporter-config.yaml
    networks:
      - connect-network
      - data-platform-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  connect-init:
    image: curlimages/curl:8.11.1
    container_name: northwind-connect-init
    # Strip CR so Windows CRLF bind-mounts do not break `set` on line 2.
    entrypoint:
      - /bin/sh
      - -c
      - "tr -d '\\r' < /scripts/register-debezium.sh | exec /bin/sh -s"
    environment:
      CONNECT_URL: http://northwind-connect:8083
      CONNECTOR_NAME: northwind-connector
      POSTGRES_HOST: northwind-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_SERVER_NAME: ${DATABASE_SERVER_NAME}
    volumes:
      - ./connect-init/register-debezium.sh:/scripts/register-debezium.sh:ro
    networks:
      - connect-network
      - data-platform-network
    depends_on:
      kafka-connect:
        condition: service_healthy
    restart: "no"

  debezium-ui:
    image: quay.io/debezium/debezium-ui:latest
    container_name: northwind-debezium-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CONNECT_URIS: http://northwind-connect:8083
    networks:
      - data-platform-network
    depends_on:
      - kafka-connect
    restart: unless-stopped

networks:
  connect-network:
    external: true
  data-platform-network:
    external: true