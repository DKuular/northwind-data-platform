# Обновляем docker-compose для server-04-spark
version: '3.8'

name: northwind-spark

services:
  spark-master:
    image: apache/spark:3.5.3
    container_name: northwind-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    networks:
      - spark-network
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.3
    container_name: northwind-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8082:8081"
    networks:
      - spark-network
    depends_on:
      - spark-master
    restart: unless-stopped

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: northwind-jupyter
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    ports:
      - "8888:8888"
    networks:
      - spark-network
    volumes:
      - ./notebooks:/home/jovyan/work
    restart: unless-stopped

networks:
  spark-network:
    external: true
    name: spark-network
