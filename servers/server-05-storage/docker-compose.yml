name: northwind-storage

services:
  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z
    container_name: northwind-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - storage-network
      - data-platform-network
    restart: unless-stopped

  superset:
    image: apache/superset:4.0.1
    container_name: northwind-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    ports:
      - "8088:8088"
    networks:
      - storage-network
      - data-platform-network
    restart: unless-stopped

volumes:
  minio_data:

networks:
  storage-network:
    external: true
  data-platform-network:
    external: true
    name: data-platform-network
