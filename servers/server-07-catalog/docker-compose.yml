name: northwind-catalog

# Credential values required in root .env; start-all.sh passes --env-file .env to compose.

# Shared DB/ES settings for migrate + server (PostgreSQL, not MySQL defaults).
x-openmetadata-env: &openmetadata-env
  DB_DRIVER_CLASS: org.postgresql.Driver
  DB_SCHEME: postgresql
  DB_PARAMS: ""
  DB_HOST: postgres-catalog
  DB_PORT: 5432
  DB_USER: ${OPENMETADATA_DB_USER}
  DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
  OM_DATABASE: openmetadata_db
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_SCHEME: http
  SEARCH_TYPE: elasticsearch
  MIGRATION_LIMIT_PARAM: 1200

services:
  postgres-catalog:
    image: postgres:15.8-alpine3.20
    container_name: northwind-catalog-postgres
    environment:
      POSTGRES_DB: openmetadata_db
      POSTGRES_USER: ${OPENMETADATA_DB_USER}
      # Must match openmetadata DB_USER_PASSWORD (OPENMETADATA_DB_PASSWORD in .env).
      # POSTGRES_PASSWORD is only applied on first volume init; changing .env later
      # does not rotate an existing catalog_postgres_data volume.
      POSTGRES_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    networks:
      - catalog-network
      - data-platform-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENMETADATA_DB_USER} -d openmetadata_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.20
    container_name: northwind-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - catalog-network
      - data-platform-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Runs Flyway/native migrations once before the API server starts (official OM pattern).
  execute-migrate-all:
    image: openmetadata/server:1.5.5
    container_name: northwind-openmetadata-migrate
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      <<: *openmetadata-env
    depends_on:
      postgres-catalog:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - catalog-network
    restart: "no"

  openmetadata:
    image: openmetadata/server:1.5.5
    container_name: northwind-openmetadata
    depends_on:
      postgres-catalog:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      execute-migrate-all:
        condition: service_completed_successfully
    environment:
      <<: *openmetadata-env
      SERVER_HOST_API: http://localhost:8585
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.NoopAuthorizer
    ports:
      - "8585:8585"
    networks:
      - catalog-network
      - data-platform-network
    restart: unless-stopped

volumes:
  catalog_postgres_data:
  elasticsearch_data:

networks:
  catalog-network:
    external: true
    name: catalog-network
  data-platform-network:
    external: true
    name: data-platform-network
